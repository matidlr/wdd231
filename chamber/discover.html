<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamber Discover Page | Community Highlights</title>
  
  <!-- Autoría -->
  <meta name="author" content="Tu Nombre y Apellido">
  
  <!-- Descripción Estándar de la Página -->
  <meta name="description" content="Explore top attractions, landmarks, and community highlights in our Chamber of Commerce area.">

  <!-- Preconnect y Carga de Google Fonts (Sin usar @import) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">

  <!-- Meta Etiquetas Open Graph (og:) para Redes Sociales -->
  <!-- Title: Entre 40 y 60 caracteres -->
  <meta property="og:title" content="Discover Our Community | Chamber of Commerce">
  
  <!-- Description: Entre 50 y 160 caracteres -->
  <meta property="og:description" content="Explore local points of interest, demographics, and key economic highlights in our Chamber of Commerce region.">
  
  <!-- Image y URL: Deben ser URLs ABSOLUTAS (remplaza tu-usuario por tu usuario de GitHub) -->
  <meta property="og:image" content="https://tu-usuario.github.io/wdd231/chamber/images/logo.webp">
  <meta property="og:url" content="https://tu-usuario.github.io/wdd231/chamber/discover.html">
  <meta property="og:type" content="website">

  <!-- Hojas de Estilo CSS -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/discover.css">

  <!-- Script JS (Modular) -->
  <script type="module" src="scripts/discover.js"></script>
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/cord.webp" alt="Chamber Logo" width="50" height="50">
      <span>Chamber of Commerce</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="discover.html" class="active">Discover</a></li>
        <li><a href="directory.html">Directory</a></li>
        <li><a href="join.html">Join</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Discover Our Community</h1>

    <!-- Last Visit Message Container -->
    <div id="visit-message" class="visit-banner"></div>

    <!-- 8 Cards Container utilizing CSS Grid Areas -->
    <section class="discover-grid" id="discover-cards">
      <!-- Dynamic cards will render here -->
    </section>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Chamber of Commerce | WDD231</p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
